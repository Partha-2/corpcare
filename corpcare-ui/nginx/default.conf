# Nginx server block for the React SPA
server {
    # Listen on port 80
    listen 80;

    # Root directory where the built files are
    root /usr/share/nginx/html;

    # Default file to serve
    index index.html;

    # Handle all routes — this is the SPA magic
    # If the requested file exists, serve it (e.g. /assets/logo.png)
    # If not, serve index.html (so React can handle /admin/clients routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}