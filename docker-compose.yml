# docker-compose.yml — CorpCare
#
# Defines the containers for your application.
# "Services" = containers that run together on the same Docker network.

services:

  # ---- Database (PostgreSQL) ----
  db:
    image: postgres:16-alpine
    container_name: corpcare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: corpcare
      POSTGRES_USER: corpcare
      POSTGRES_PASSWORD: corpcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpcare -d corpcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---- Backend (Spring Boot API) ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: corpcare-backend

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: postgres.assuteofthnxatpyugrs
      SPRING_DATASOURCE_PASSWORD: tFNhluqGVUpuNLKA
      GROQ_API_KEY: ${GROQ_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      BOLNA_API_KEY: ${BOLNA_API_KEY}

    ports:
      - "8080:8080"

  # ---- Frontend (React SPA served by Nginx) ----
  frontend:
    build:
      context: ./corpcare-ui
      dockerfile: Dockerfile

    container_name: corpcare-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  pgdata: