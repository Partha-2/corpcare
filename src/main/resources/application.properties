# Server
server.port=8080

# MySQL Database (persistent storage)
spring.datasource.url=jdbc:mysql://localhost:3306/corpcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Twilio Configuration (WhatsApp)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Bolna.ai Voice Call Configuration
bolna.api.key=${BOLNA_API_KEY:YOUR_BOLNA_API_KEY}
bolna.api.url=${BOLNA_API_URL:https://api.bolna.ai/call}
bolna.agent.id=${BOLNA_AGENT_ID:}
