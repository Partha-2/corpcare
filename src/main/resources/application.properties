# Server
server.port=8080

# Database — default: H2 file mode (works everywhere)
# Override with SPRING_DATASOURCE_URL env var to use MySQL (e.g. on Render)
# To use MySQL LOCALLY instead of H2:
#   export SPRING_DATASOURCE_URL='jdbc:mysql://td8n6s.h.filess.io:3307/corpcare_simplestdo?useSSL=false&serverTimezone=UTC'
#   export SPRING_DATASOURCE_USERNAME=corpcare_simplestdo
#   export SPRING_DATASOURCE_PASSWORD=your_actual_password
#   export SPRING_DATASOURCE_DRIVER=com.mysql.cj.jdbc.Driver
# Then run: mvn spring-boot:run
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/corpcare;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_DATASOURCE_DIALECT:org.hibernate.dialect.H2Dialect}

# Connection pool — keep under Filess.io free tier limit (max 5, leaves room for MySQL Workbench)
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION:60000}
spring.datasource.hikari.pool-name=CorpCarePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=-1

# H2 Console (only accessible when H2 is on classpath)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Admin
admin.password=${ADMIN_PASSWORD:admin123}

# Twilio Configuration (WhatsApp)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:+14155238886}

# Bolna.ai Voice Call Configuration
bolna.api.key=${BOLNA_API_KEY:YOUR_BOLNA_API_KEY}
bolna.api.url=${BOLNA_API_URL:https://api.bolna.ai/call}
bolna.agent.id=${BOLNA_AGENT_ID:87bf2a9f-3da8-47cb-b3cb-3f6cc112c4f1}

# Groq AI Chat
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
