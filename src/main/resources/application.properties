# Server
server.port=8080

# Database — default: H2 file mode (works everywhere)
# Override with SPRING_DATASOURCE_URL env var to use MySQL (e.g. on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/corpcare;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Connection pool — keep under free tier limits (Filess.io max 5)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# H2 Console (only accessible when H2 is on classpath)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Admin
admin.password=${ADMIN_PASSWORD:admin123}

# Twilio Configuration (WhatsApp)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:+14155238886}

# Bolna.ai Voice Call Configuration
bolna.api.key=${BOLNA_API_KEY:YOUR_BOLNA_API_KEY}
bolna.api.url=${BOLNA_API_URL:https://api.bolna.ai/call}
bolna.agent.id=${BOLNA_AGENT_ID:87bf2a9f-3da8-47cb-b3cb-3f6cc112c4f1}

# Groq AI Chat
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
