# Server
server.port=8080

# H2 Database (file-based — no MySQL needed, persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/corpcare;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (for debugging — accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Twilio Configuration (WhatsApp)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}

# Bolna.ai Voice Call Configuration
bolna.api.key=${BOLNA_API_KEY:YOUR_BOLNA_API_KEY}
bolna.api.url=${BOLNA_API_URL:https://api.bolna.ai/call}
bolna.agent.id=${BOLNA_AGENT_ID:}
