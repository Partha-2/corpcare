# Server
server.port=8080

# Database — Supabase PostgreSQL (same for local & Docker)
# Override with SPRING_DATASOURCE_URL env var to use a different database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.assuteofthnxatpyugrs.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tFNhluqGVUpuNLKA}


spring.jpa.properties.hibernate.format_sql=true
# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_DATASOURCE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Connection pool
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:10000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION:30000}
spring.datasource.hikari.pool-name=CorpCarePool
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.initialization-fail-timeout=-1
logging.level.com.zaxxer.hikari=DEBUG

# H2 Console (only accessible when H2 driver is on classpath)
spring.h2.console.enabled=false

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Admin
admin.password=${ADMIN_PASSWORD:admin123}

# Twilio Configuration (WhatsApp)
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:+14155238886}

# Bolna.ai Voice Call Configuration
bolna.api.key=${BOLNA_API_KEY:YOUR_BOLNA_API_KEY}
bolna.api.url=${BOLNA_API_URL:https://api.bolna.ai/call}
bolna.agent.id=${BOLNA_AGENT_ID:87bf2a9f-3da8-47cb-b3cb-3f6cc112c4f1}

# Groq AI Chat
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jpa.open-in-view=true
